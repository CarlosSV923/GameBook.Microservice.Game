name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository workflow files
        shell: bash
        run: |
          set -euo pipefail
          test -f CONTRIBUTING.md
          test -f .github/pull_request_template.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release-please.yml
          test -f release-please-config.json
          test -f .release-please-manifest.json
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const files = ['release-please-config.json', '.release-please-manifest.json']; for (const file of files) JSON.parse(await readFile(file, 'utf8')); const pkg = JSON.parse(await readFile('package.json', 'utf8')); const manifest = JSON.parse(await readFile('.release-please-manifest.json', 'utf8')); if (manifest['.'] !== pkg.version) throw new Error('release-please manifest version does not match package.json');"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Check formatting
        run: pnpm run format:check
      - name: Run lint
        run: pnpm run lint
      - name: Check types
        run: pnpm run typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Run isolated integration tests
        run: pnpm run test:e2e
      - name: Build application
        run: pnpm run build
