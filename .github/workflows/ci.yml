name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository workflow files
        shell: bash
        run: |
          set -euo pipefail
          test -f CONTRIBUTING.md
          test -f .github/pull_request_template.md
          test -f .github/workflows/ci.yml
