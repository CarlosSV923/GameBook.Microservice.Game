name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Open main to develop sync PR
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_pr_count=$(gh pr list --base develop --head main --state open --repo ${{ github.repository }} --json number --jq 'length')
          if [ "$open_pr_count" -eq 0 ]; then
            gh pr create \
              --repo ${{ github.repository }} \
              --base develop \
              --head main \
              --title "chore: sync main into develop" \
              --body "Brings the release commits back to develop. Merge this pull request with a merge commit."
          else
            echo "An open main to develop pull request already exists; skipping."
          fi
